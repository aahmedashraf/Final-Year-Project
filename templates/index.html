<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DII Inflammation Tracker</title>
    <link rel="stylesheet" href="static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>DII Inflammation Tracker</h1>
        <p>
          Track your diet's inflammation potential. Negative scores indicate an
          anti-inflammatory diet, while positive scores indicate a
          pro-inflammatory diet.
        </p>
      </header>

      <main class="main-content">
        <!-- Login Section -->
        <section class="login-section">
          <h2>Login</h2>
          <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required />
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
            />
            <button type="submit">Login</button>
          </form>
        </section>
      </main>
    </div>
    <script src="static/script.js"></script>
  </body>
</html>
