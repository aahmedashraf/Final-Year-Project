<!DOCTYPE html>
<html>
  <head>
    <title>{{ ingredient.name }}</title>
  </head>
  <body>
    <h1>{{ ingredient.name }}</h1>
    <p>Category: {{ ingredient.category }}</p>
    <p>Portion Size: {{ ingredient.portion_size }}</p>

    <h2>Nutrients and DII Scores</h2>
    <ul>
      {% for nutrient in nutrients %}
      <li>
        {{ nutrient.name }}: {{ nutrient.value }} {{ nutrient.unit }} (DII: {{
        nutrient.dii_score }})
      </li>
      {% endfor %}
    </ul>

    <form method="POST" action="/log">
      <input type="hidden" name="ingredient_id" value="{{ ingredient.id }}" />
      <label for="portion_size">Portion Size:</label>
      <input type="number" name="portion_size" step="0.01" required />
      <button type="submit">Log Ingredient</button>
    </form>
  </body>
</html>
