<!DOCTYPE html>
<html>
<head>
    <title>Diary</title>
</head>
<body>
    <h1>Food Diary</h1>
    <ul>
        {% for entry in diary_entries %}
        <li>{{ entry.name }} - Portion: {{ entry.portion_size }}g, DII Contribution: {{ entry.dii_contribution }}</li>
        {% endfor %}
    </ul>
    <h2>Total DII Score: {{ total_dii }}</h2>
</body>
</html>
